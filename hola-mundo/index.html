<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Hola Mundo! 🌍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fondo animado de burbujas -->
  <div class="blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="card">
    <div class="emoji" id="emoji">👋</div>
    <h1 class="title">Hola, <span class="gradient-text">Mundo</span></h1>
    <p class="subtitle">
      Una web molona hecha con <strong>Kiro</strong> ✨
    </p>

    <button class="btn" id="colorBtn" type="button">
      Cambia el color 🎨
    </button>

    <p class="counter">
      Me has saludado <span id="count">0</span> veces
    </p>

    <footer class="footer">
      Hecho con 💜 · <span id="year"></span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
